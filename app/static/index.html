<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3864">
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Workout Tracker</h1>
    <form class="logout" method="post" action="/logout"><button type="submit">Log out</button></form>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="log" role="tab">Log</button>
      <button class="tab" data-view="history" role="tab">History</button>
    </nav>
  </header>

  <main>
    <section id="view-log" class="view">
      <div class="row">
        <label class="field grow">
          <span>What are you hitting?</span>
          <select id="routine"></select>
        </label>
        <label class="field">
          <span>Date</span>
          <input type="date" id="date">
        </label>
      </div>
      <p class="status" id="status"></p>

      <div id="exercises"></div>

      <div class="add-exercise" id="add-exercise">
        <input id="new-exercise" list="exercise-list" placeholder="Add another exercise…" autocomplete="off">
        <datalist id="exercise-list"></datalist>
        <button class="btn secondary" id="add-exercise-btn" type="button">Add</button>
      </div>

      <label class="field notes">
        <span>Notes</span>
        <textarea id="notes" rows="2" placeholder="Optional"></textarea>
      </label>

      <div class="savebar">
        <button class="btn primary" id="save" type="button">Save workout</button>
      </div>
    </section>

    <section id="view-history" class="view" hidden>
      <div id="history"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
